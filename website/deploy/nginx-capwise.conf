server {
	listen 80;
	listen [::]:80;
	server_name capwise.qiaomu.ai;
	server_tokens off;
	location /.well-known/acme-challenge/ { root /var/www/la-vpn; try_files $uri =404; }
	location / { return 301 https://$host$request_uri; }
	access_log off;
}

server {
	listen 443 ssl http2;
	server_name capwise.qiaomu.ai;
	server_tokens off;
	ssl_certificate /etc/letsencrypt/live/capwise.qiaomu.ai/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/capwise.qiaomu.ai/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:capwise_ssl:10m;
	ssl_session_timeout 1d;

	root /var/www/capwise/current;
	index index.html;
	charset utf-8;
	error_page 404 /404.html;

	gzip on;
	gzip_static on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_types text/css application/javascript text/plain application/json application/manifest+json image/svg+xml application/xml;

	location = /index.html {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "no-cache" always;
	}
	location = /sw.js {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "no-cache" always;
	}
	location = /site.webmanifest {
		types { application/manifest+json webmanifest; }
		include snippets/capwise-headers.conf;
		add_header Cache-Control "public, max-age=3600" always;
	}
	location ~ ^/(styles\.css|app\.js)$ {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}
	location /fonts/ {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header Access-Control-Allow-Origin "*" always;
	}
	location /assets/ {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "public, max-age=2592000" always;
	}
	location / {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "public, max-age=3600" always;
		try_files $uri $uri.html $uri/ =404;
	}
	location = / {
		include snippets/capwise-headers.conf;
		add_header Cache-Control "no-cache" always;
		try_files /index.html =404;
	}
	access_log off;
}
